<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal Chat</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --panel: #0a0a0a;
        --user: #16324f;
        --bot: #111;
        --text: #e7e9ee;
        --muted: #8b93a3;
        --accent: #4c86ff;
        --font-size: 14px;
        --font-family: monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: var(--font-size) / 1.45 var(--font-family);
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        max-width: 82%;
      }
      .row.bot {
        align-self: flex-start;
      }
      .row .avatar {
        width: 28px;
        height: 28px;
        flex: none;
        object-fit: cover;
      }
      .msg {
        max-width: 82%;
        padding: 8px 12px;
        border-radius: 0;
        white-space: normal;
        word-wrap: break-word;
      }
      .row .msg {
        max-width: none;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user);
      }
      .msg.user.failed {
        background: #8c2f2f;
        color: #fff;
      }
      @keyframes flashFailed {
        0%,
        100% {
          box-shadow: none;
        }
        50% {
          box-shadow: inset 0 0 0 9999px rgba(140, 47, 47, 0.55);
        }
      }
      .msg.flash-failed {
        animation: flashFailed 0.6s ease;
      }
      .msg.bot {
        align-self: flex-start;
        background: var(--bot);
      }
      .msg .ts {
        color: var(--muted);
        font-size: 0.8em;
        margin-bottom: 4px;
      }
      .msg .ts-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 4px;
      }
      .msg .ts-row .ts {
        margin-bottom: 0;
      }
      .msg .bot-name {
        color: var(--bot-name, var(--accent));
        font-size: 0.8em;
      }
      .msg .quote {
        border-left: 3px solid var(--accent);
        padding-left: 8px;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 0.87em;
      }
      .msg pre {
        background: #0a0a0a;
        padding: 8px;
        border-radius: 0;
        overflow-x: auto;
      }
      .msg code {
        background: #0a0a0a;
        padding: 1px 4px;
        border-radius: 0;
      }
      .msg a {
        color: var(--accent);
      }
      .spoiler {
        background: #222;
        color: transparent;
        border-radius: 0;
        cursor: pointer;
      }
      .spoiler.revealed {
        color: inherit;
        background: #0a0a0a;
      }
      .reactions {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      .react-buttons {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .reactions.collapsed .react-buttons {
        display: none;
      }
      .reactions .opener {
        padding: 0 6px;
        line-height: 1.6;
        opacity: 0.6;
      }
      .reactions .opener:hover {
        opacity: 1;
      }
      .reactions button {
        background: #0a0a0a;
        border: 1px solid #333a47;
        color: var(--text);
        border-radius: 0;
        padding: 2px 8px;
        cursor: pointer;
        font-size: 1em;
      }
      .reactions button:hover {
        border-color: var(--accent);
      }
      #typing {
        padding: 0 16px 6px;
        color: var(--muted);
        font-size: 0.87em;
        min-height: 18px;
      }
      form {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        background: var(--panel);
        border-top: 1px solid #1a1a1a;
      }
      textarea {
        flex: 1;
        resize: none;
        background: var(--bg);
        color: var(--text);
        border: 1px solid #333a47;
        border-radius: 0;
        padding: 9px 12px;
        font: inherit;
      }
      button.send {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 0;
        padding: 0 18px;
        cursor: pointer;
        font: inherit;
      }
      #splash {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 32px 16px;
        text-align: center;
      }
      #splash img {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
      }
      #splash-name {
        font-size: 1.15em;
        color: var(--text);
      }
      #splash-about {
        color: var(--muted);
        font-size: 0.9em;
        max-width: 340px;
      }
    </style>
  </head>
  <body>
    <div id="log"></div>
    <div id="typing"></div>
    <form id="compose">
      <textarea
        id="input"
        rows="1"
        placeholder="Message"
        autocomplete="off"
      ></textarea>
      <button class="send" type="submit">Send</button>
    </form>
    <script src="/chat.js"></script>
  </body>
</html>
